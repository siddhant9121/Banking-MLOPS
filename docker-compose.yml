version: "3.8"

services:

  # ── FastAPI document processing service ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banking-doc-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models       # persist trained model artefacts
      - ./mlruns:/app/mlruns       # share MLflow run data with mlflow service
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - banking-net

  # ── MLflow tracking server ───────────────────────────────────────────────────
  mlflow:
    image: python:3.9-slim
    container_name: banking-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      bash -c "pip install mlflow --quiet &&
               mlflow server
                 --host 0.0.0.0
                 --port 5000
                 --backend-store-uri /mlruns
                 --default-artifact-root /mlruns"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - banking-net

networks:
  banking-net:
    driver: bridge

volumes:
  mlruns:
  models:
