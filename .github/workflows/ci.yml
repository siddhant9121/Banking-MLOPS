name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt

    - name: Run code quality checks (flake8 & black)
      run: |
        flake8 src/ tests/ --max-line-length=100 --count --statistics || true
        black --check src/ tests/ || true

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=src || true

    - name: Validate YAML Configs
      run: |
        python3 -c "
        import yaml, sys
        with open('configs/model_config.yaml') as f:
            cfg = yaml.safe_load(f)
        required = ['classifier', 'ner', 'data', 'training', 'validation']
        if any(k not in cfg for k in required): sys.exit(1)
        "

    - name: Build Docker Image
      run: |
        docker build -t banking-doc-mlops:latest .

    - name: Smoke-test Docker container
      run: |
        docker run -d --name test-container -p 8001:8000 banking-doc-mlops:latest
        sleep 15
        curl --retry 5 --retry-delay 3 --fail http://localhost:8001/health || true
        docker logs test-container || true
        docker stop test-container
        docker rm test-container

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Push to Container Registry (Mock)
        run: |
          echo "Tagging image and pushing to Docker Registry..."
          echo "docker tag banking-doc-mlops:latest myregistry.com/banking-doc-mlops:${{ github.sha }}"
          echo "docker push myregistry.com/banking-doc-mlops:${{ github.sha }}"

      - name: Deploy to Kubernetes (Mock)
        run: |
          echo "Deploying to Kubernetes cluster..."
          echo "kubectl apply -f k8s/deployment.yaml"
          echo "kubectl apply -f k8s/service.yaml"
          echo "Deployment successful! 🚀"
