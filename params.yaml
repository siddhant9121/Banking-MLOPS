# DVC params file — mirrors key training hyperparameters for experiment tracking
train:
  epochs:       50
  batch_size:   32
  learning_rate: 0.001
  random_seed:  42

ner:
  epochs:        30
  batch_size:    16
  learning_rate: 0.00005

evaluate:
  confidence_threshold:     0.85
  min_classifier_accuracy:  0.90
  min_ner_f1:               0.88
